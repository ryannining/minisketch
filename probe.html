<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0}iframe{width:1200px;height:800px;border:0}pre{font:11px monospace}</style></head>
<body><iframe src="index.html"></iframe><pre id="out">…</pre>
<script>
const f=document.querySelector('iframe');
f.onload=()=>setTimeout(()=>{
  const w=f.contentWindow,d=f.contentDocument,out=[];
  const AI=w.MiniSketchAI;
  try{
    // 1. circle -> array grid 3x2 via the REAL dialog
    AI.applyOps([{name:'add_circle',arguments:{c:{x:0,y:0},r:10,color:'#000000'}}]);
    const st=()=>w.MiniSketchAI._apiRef.state;
    const circleId=Object.values(st().entities).find(e=>e.type==='circle').id;
    AI.applyOps([{name:'set_selection',arguments:{ids:[circleId]}}]);
    d.getElementById('btn-array').click();
    d.getElementById('arr-rows').value='2';
    d.getElementById('arr-cols').value='3';
    d.getElementById('arr-dx').value='40';
    d.getElementById('arr-dy').value='40';
    d.getElementById('arr-run').click();
    const ents=Object.values(st().entities);
    out.push('entities: '+ents.map(e=>e.type+'#'+e.id).join(', '));
    const arr=ents.find(e=>e.type==='array');
    out.push('array: '+JSON.stringify({id:arr.id,kind:arr.kind,params:arr.params,guide:arr.guide,masters:arr.masters,shapes:(arr.shapes||[]).length}));
    // 2. export through the AI tool (noGuides default true)
    const res=AI.applyOps([{name:'get_svg',arguments:{scope:'all'}}]);
    const svg=res.queryResults?.[0]?.result?.svg||'';
    const greens=(svg.match(/#00ff00/gi)||[]).length;
    const paths=(svg.match(/<path/g)||[]).length;
    const circles=(svg.match(/<circle/g)||[]).length;
    out.push('svg: greens='+greens+' paths='+paths+' circles='+circles+' len='+svg.length);
    out.push('clones drawn? '+(paths+circles>=6?'YES':'NO'));
  }catch(e){out.push('ERR '+e.stack.split('\n').slice(0,3).join(' | '));}
  document.getElementById('out').textContent=out.join('\n');
},2500);
</script></body></html>
